[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motorlog"
version = "0.1.0"
description = "Demo-Tool: Prüfstand-Messdaten auswerten"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
motorlog = "motorlog.cli:main"

[tool.setuptools]
packages = ["motorlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
